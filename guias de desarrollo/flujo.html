<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedicDate web | Prototipo del flujo completo</title>
<style>
:root{
  --azul:#0B5FA5;--azul-osc:#084a82;--azul-claro:#CFE1F4;--fondo:#E6EDF5;--sup:#F1F5FA;--alta:#DCE6F1;--campo:#F7FAFD;
  --texto:#191C1F;--suave:#43494F;--borde:#6F7983;--linea:#C3CDD8;--rojo:#B3261E;--verde:#1B5E20;
  --e1:0 1px 2px rgba(0,0,0,.18),0 1px 3px 1px rgba(0,0,0,.1);--e2:0 1px 2px rgba(0,0,0,.18),0 2px 6px 2px rgba(0,0,0,.12);--e3:0 4px 8px 3px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.5 Roboto,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:Montserrat,"Segoe UI",Arial,sans-serif;margin:0}
a{color:var(--azul);text-decoration:none}
button{font:inherit;cursor:pointer}
.cont{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}
/* barra del prototipo */
#demo{background:#101820;color:#E6EDF5;font-size:13px;padding:8px 0}
#demo .cont{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#demo span{opacity:.85}
#demo button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:4px 12px;font-size:13px}
#demo button:hover{background:rgba(255,255,255,.26)}
/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border-radius:999px;border:1px solid transparent;font-weight:500;transition:box-shadow .2s,background .2s}
.btn-p{background:var(--azul);color:#fff}.btn-p:hover{background:var(--azul-osc);box-shadow:var(--e1);color:#fff}
.btn-o{background:transparent;color:var(--azul);border-color:var(--borde)}.btn-o:hover{background:rgba(11,95,165,.08)}
.btn-r{background:transparent;color:var(--rojo);border-color:var(--rojo)}.btn-r:hover{background:rgba(179,38,30,.08)}
.btn-s{height:34px;padding:0 14px;font-size:14px}
.btn-l{background:#fff;color:var(--azul)}.btn-l:hover{background:var(--azul-claro)}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.campo label{font-size:14px;font-weight:500;color:var(--suave)}
.campo input,.campo select,.campo textarea{width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:8px;background:var(--campo);font:inherit;color:var(--texto)}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--azul);border-color:var(--azul)}
.campo textarea{min-height:96px;resize:vertical}
.campo.chk{flex-direction:row;align-items:center;gap:10px}.campo.chk input{width:20px;height:20px}
.err{color:var(--rojo);font-size:14px;margin:0 0 12px}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:500}
.b-ok{background:#C8E6C9;color:var(--verde)}.b-azul{background:var(--azul-claro);color:var(--azul-osc)}.b-rojo{background:#F9DEDC;color:#8C1D18}.b-gris{background:var(--alta);color:var(--suave)}
/* portal público */
header.nav{background:var(--sup);box-shadow:var(--e1);position:sticky;top:0;z-index:20}
header.nav .cont{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.marca{display:flex;align-items:center;gap:10px;font:700 20px Montserrat,Arial,sans-serif;color:var(--azul)}
.marca i{width:38px;height:38px;border-radius:10px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;line-height:1}
.menu{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.menu a.l{padding:8px 14px;border-radius:999px;color:var(--texto);font-weight:500;font-size:15px}
.menu a.l:hover{background:rgba(11,95,165,.08)}.menu a.l.on{background:var(--azul-claro);color:var(--azul-osc)}
.burger{display:none;background:none;border:1px solid var(--borde);border-radius:8px;padding:6px 12px}
@media(max-width:960px){.burger{display:block}.menu{display:none;width:100%;flex-direction:column;align-items:stretch;padding-bottom:12px}.menu.abierto{display:flex}header.nav .cont{flex-wrap:wrap}}
.hero{position:relative;overflow:hidden;color:#fff}
.slide{display:none;min-height:540px;padding:80px 0;align-items:center}
.slide.on{display:flex}
.slide .t{max-width:600px}
.slide h1,.slide h2{font-size:48px;line-height:1.1;margin-bottom:16px}
.slide p{font-size:19px;margin:0 0 28px;color:#E6F0FA}
.flecha{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px}
.flecha:hover{background:rgba(255,255,255,.36)}.fl-i{left:16px}.fl-d{right:16px}
.puntos{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.puntos button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.5);padding:0}.puntos button.on{background:#fff;width:28px;border-radius:6px}
.hero.una .flecha,.hero.una .puntos{display:none}
.sec{padding:56px 0}.sec.ton{background:var(--alta)}
.sec h2.t{font-size:28px;margin-bottom:6px}.sec .sub{color:var(--suave);max-width:62ch;margin:0 0 28px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--sup);border-radius:16px;box-shadow:var(--e1);padding:24px;transition:box-shadow .2s}
a.card{color:inherit;display:block}a.card:hover{box-shadow:var(--e2)}
.card h3{font-size:18px;margin:14px 0 8px}.card p{margin:0;color:var(--suave);font-size:15px}
.ic{width:48px;height:48px;border-radius:50%;background:var(--azul-claro);color:var(--azul);display:flex;align-items:center;justify-content:center;font:700 20px Montserrat,Arial,sans-serif}
.ic.g{width:72px;height:72px;font-size:26px}
.mas{display:inline-block;margin-top:14px;font-weight:500;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{padding:3px 12px;border-radius:8px;background:var(--alta);font-size:13px;color:var(--suave)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.dia{background:var(--sup);border-radius:16px;box-shadow:var(--e1);padding:18px 8px;text-align:center}
.dia b{display:block;font-family:Montserrat,Arial,sans-serif}.dia span{font-size:14px;color:var(--suave)}
@media(max-width:800px){.dias{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){.dias{grid-template-columns:repeat(2,1fr)}.slide h1,.slide h2{font-size:34px}}
.est{color:#F9A825;letter-spacing:2px}
.prom{display:flex;align-items:center;gap:14px;margin-bottom:20px}.prom b{font:700 44px Montserrat,Arial,sans-serif;color:var(--azul)}
.mapa{border:0;width:100%;height:100%;min-height:300px;border-radius:16px}
.dato{display:flex;gap:12px;margin-bottom:14px}.dato b{display:block;font-size:14px;color:var(--suave);font-weight:500}
.pagina{background:var(--alta);border-bottom:1px solid var(--linea);padding:40px 0}
.pagina h1{font-size:34px;margin-bottom:6px}.pagina p{margin:0;color:var(--suave);max-width:64ch}
.cifra{text-align:center;padding:20px}.cifra b{display:block;font:700 32px Montserrat,Arial,sans-serif;color:var(--azul)}.cifra span{font-size:14px;color:var(--suave)}
details.faq{background:var(--sup);border-radius:12px;box-shadow:var(--e1);margin-bottom:10px;padding:0 20px}
details.faq summary{padding:16px 0;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-size:22px;color:var(--azul)}details.faq[open] summary::after{content:"–"}
details.faq p{margin:0 0 16px;color:var(--suave)}
.filtro{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.fbtn{padding:6px 18px;border-radius:8px;border:1px solid var(--borde);background:transparent;color:var(--texto)}.fbtn.on{background:var(--azul-claro);border-color:var(--azul-claro);color:var(--azul-osc);font-weight:500}
.tarj-top{height:8px;border-radius:16px 16px 0 0}
.art{max-width:760px}.art p{margin:0 0 16px}
.vol{display:inline-block;margin-bottom:18px;font-weight:500}
.cta{background:var(--azul);color:#fff;border-radius:16px;padding:32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.cta h3{font-size:22px}.cta p{margin:6px 0 0;color:#DCE9F7}
footer.pie{background:var(--alta);margin-top:auto;border-top:1px solid var(--linea)}
footer.pie .cols{display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:24px;padding:36px 0 20px}
footer.pie h4{font-size:15px;margin-bottom:10px}footer.pie a,footer.pie .d{display:block;font-size:14px;color:var(--suave);margin-bottom:6px}footer.pie a:hover{color:var(--azul)}
footer.pie .fin{border-top:1px solid var(--linea);padding:14px 0;font-size:13px;color:var(--suave)}
@media(max-width:800px){footer.pie .cols{grid-template-columns:1fr 1fr}}
/* login */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 38px);flex:1}
.lp{background:linear-gradient(160deg,#0B5FA5,#073d6d);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.lp h1{font-size:34px;line-height:1.15;margin:32px 0 12px}.lp p{color:#DCE9F7;max-width:44ch}
.lp ul{list-style:none;padding:0;margin:28px 0 0}.lp li{margin-bottom:10px;padding-left:28px;position:relative}.lp li::before{content:"✓";position:absolute;left:0;font-weight:700}
.lf{display:flex;align-items:center;justify-content:center;padding:32px}
.lc{background:var(--sup);border-radius:28px;box-shadow:var(--e2);padding:40px;width:100%;max-width:440px}
.lc h2{font-size:26px;margin-bottom:6px}.lc .s{color:var(--suave);margin:0 0 24px}
.ojo{position:relative}.ojo button{position:absolute;right:8px;bottom:6px;background:none;border:0;color:var(--azul);font-size:13px;height:32px;padding:0 8px}
.demo-cred{background:var(--azul-claro);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:18px}
@media(max-width:800px){.login{grid-template-columns:1fr}.lp{display:none}}
.pasos{display:flex;gap:6px;margin-bottom:8px}.pasos span{flex:1;height:6px;border-radius:3px;background:var(--linea)}.pasos span.on{background:var(--azul)}
.preg{background:var(--azul-claro);border-radius:12px;padding:14px 16px;margin-bottom:16px}.preg small{display:block;color:var(--azul-osc);font-size:13px;margin-bottom:2px}.preg b{font-weight:500}
.ok-ic{width:64px;height:64px;border-radius:50%;background:#C8E6C9;color:var(--verde);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.olv{text-align:right;margin:-6px 0 16px;font-size:14px}
/* panel privado */
.priv{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:calc(100vh - 38px)}
aside.lat{background:var(--sup);border-right:1px solid var(--linea);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
aside.lat .marca{padding:4px 12px 16px}
aside.lat .tit{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--suave);padding:16px 14px 6px}
aside.lat a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;color:var(--texto);font-size:15px;font-weight:500}
aside.lat a.marca{color:var(--azul);font-size:20px;padding:4px 12px 16px}aside.lat a:hover{background:rgba(11,95,165,.08)}aside.lat a.on{background:var(--azul-claro);color:var(--azul-osc)}
.pc{padding:28px 36px 48px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
.bar h1{font-size:26px}.bar .u{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--suave)}
.av{width:38px;height:38px;border-radius:50%;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.panel{background:var(--sup);border-radius:16px;box-shadow:var(--e1);padding:24px;margin-bottom:20px}
.resu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.resu .card{padding:18px}.resu b{display:block;font:700 30px Montserrat,Arial,sans-serif;color:var(--azul)}.resu span{font-size:14px;color:var(--suave)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--suave);font-weight:500;padding:10px 12px;border-bottom:2px solid var(--linea);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--linea);font-size:15px;vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(11,95,165,.05)}
.acc{text-align:right;white-space:nowrap}.acc .btn+.btn{margin-left:6px}.acc .btn{padding:0 10px}
.filt{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;align-items:flex-end}.filt .campo{margin:0;min-width:170px}
.vacio{text-align:center;color:var(--suave);padding:32px 0}
.mini{width:92px;height:52px;border-radius:8px;display:block}
@media(max-width:860px){.priv{grid-template-columns:1fr}aside.lat{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--linea)}aside.lat .tit,aside.lat .marca{display:none}aside.lat a{white-space:nowrap}.pc{padding:20px}}
/* modal y aviso */
#modal{position:fixed;inset:0;background:rgba(16,24,32,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
#modal.on{display:flex}
.mc{background:var(--sup);border-radius:28px;box-shadow:var(--e3);padding:28px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.mc h3{font-size:22px;margin-bottom:16px}.mc .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:15px}.kv b{color:var(--suave);font-weight:500}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2B3137;color:#fff;padding:12px 22px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:200;font-size:14px;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

/* CRUD genérico */
const ENT={
 hero:{t:"Imágenes del hero",s:"imagen",max:6,cols:["fondo","titulo","texto"],campos:[{k:"titulo",l:"Título",req:1,max:60},{k:"texto",l:"Texto",t:"area",max:160},{k:"boton",l:"Texto del botón",max:24},{k:"enlace",l:"Enlace del botón",t:"sel",o:()=>ENL.map(e=>[e[0],e[1]])},{k:"fondo",l:"Fondo",t:"sel",req:1,o:()=>Object.entries(FONDOS).map(([k,v])=>[k,v[0]])}],hint:"Son las imágenes que rotan en el carrusel del Inicio. Máximo 6."},

 especialidades:{t:"Especialidades",s:"especialidad",cols:["nombre","resumen"],campos:[{k:"nombre",l:"Nombre",req:1},{k:"resumen",l:"Resumen",req:1},{k:"detalle",l:"Detalle",t:"area",req:1}]},
 medicos:{t:"Médicos",s:"médico",cols:["nombre","especialidadId","dias","horario"],campos:[{k:"nombre",l:"Nombre",req:1},{k:"especialidadId",l:"Especialidad",t:"sel",req:1,o:()=>DB.especialidades.map(e=>[e.id,e.nombre])},{k:"dias",l:"Días de atención (separados por coma)",req:1},{k:"horario",l:"Horario",req:1},{k:"descripcion",l:"Descripción",t:"area"}]},
 resenas:{t:"Reseñas",s:"reseña",cols:["nombre","estrellas","texto","publicada"],campos:[{k:"nombre",l:"Nombre del paciente",req:1},{k:"estrellas",l:"Calificación",t:"sel",req:1,o:()=>[5,4,3,2,1].map(n=>[n,n+" estrellas"])},{k:"texto",l:"Comentario",t:"area",req:1},{k:"publicada",l:"Publicada en el portal",t:"chk"}],hint:"Solo se muestran en el Inicio las reseñas marcadas como publicadas."},
 preguntas:{t:"Preguntas frecuentes",s:"pregunta",lista:"faq",cols:["pregunta","respuesta"],campos:[{k:"pregunta",l:"Pregunta",req:1},{k:"respuesta",l:"Respuesta",t:"area",req:1}]},
 consejos:{t:"Consejos y noticias",s:"publicación",cols:["tipo","titulo","fecha","publicada"],campos:[{k:"tipo",l:"Tipo",t:"sel",req:1,o:()=>[["Consejo","Consejo de salud"],["Noticia","Noticia"]]},{k:"titulo",l:"Título",req:1},{k:"resumen",l:"Resumen",req:1},{k:"contenido",l:"Contenido",t:"area",req:1},{k:"fecha",l:"Fecha",t:"date",req:1},{k:"publicada",l:"Publicada en el portal",t:"chk"}]}

const lista=k=>DB[ENT[k].lista||k];
function celda(k,c,r){const v=r[c];
 if(c==="fondo")return `<span class="mini" style="background:${FONDOS[v]?FONDOS[v][1]:""}"></span>`;
 if(c==="especialidadId")return esc(esp(v));if(c==="publicada")return v?'<span class="badge b-ok">Publicada</span>':'<span class="badge b-gris">Oculta</span>';
 if(c==="estrellas")return `<span class="est">${"★".repeat(v)}</span>`;if(c==="fecha")return fecha(v);
 if(c==="tipo")return `<span class="badge ${v==="Noticia"?"b-ok":"b-azul"}">${esc(v)}</span>`;
 const t=String(v??"");return esc(t.length>70?t.slice(0,70)+"…":t)}
function vCrud(k){const E=ENT[k],l=lista(k),cabs={fondo:"Fondo",titulo:"Título",texto:"Texto",nombre:"Nombre",resumen:"Resumen",especialidadId:"Especialidad",dias:"Días",horario:"Horario",estrellas:"Calificación",publicada:"Estado",pregunta:"Pregunta",respuesta:"Respuesta",tipo:"Tipo",fecha:"Fecha"};
 return privado("admin",k,E.t,`<div class="panel">${E.hint?`<p style="margin:0 0 14px;color:var(--suave)">${E.hint}</p>`:""}<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>${l.length} ${l.length===1?"registro":"registros"}</b><button class="btn btn-p btn-s" onclick="formCrud('${k}')">+ Agregar ${E.s}</button></div>
 <div class="tw"><table><thead><tr>${E.cols.map(c=>`<th>${cabs[c]||c}</th>`).join("")}<th></th></tr></thead><tbody>${l.map((r,i)=>`<tr>${E.cols.map(c=>`<td>${celda(k,c,r)}</td>`).join("")}<td class="acc">${k==="hero"?`<button class="btn btn-o btn-s" ${i?"":"disabled"} onclick="mover(${i},-1)" aria-label="Subir">↑</button><button class="btn btn-o btn-s" ${i<l.length-1?"":"disabled"} onclick="mover(${i},1)" aria-label="Bajar">↓</button>`:""}<button class="btn btn-o btn-s" onclick="formCrud('${k}',${r.id})">Editar</button><button class="btn btn-r btn-s" onclick="pedirBorrar('${k}',${r.id})">Eliminar</button></td></tr>`).join("")}</tbody></table>${l.length?"":'<div class="vacio">Todavía no hay registros. Agrega el primero.</div>'}</div></div>`)}
function mover(i,d){const l=DB.hero,j=i+d;[l[i],l[j]]=[l[j],l[i]];guardar();render()}
function formCrud(k,id){const E=ENT[k],l=lista(k),r=id?l.find(x=>x.id==id):{publicada:true,fecha:dia(0)};
 if(!id&&E.max&&l.length>=E.max)return toast(`Solo puedes tener ${E.max} imágenes en el carrusel.`);
 if(k==="medicos"&&!DB.especialidades.length)return toast("Primero agrega una especialidad.");
 abrirModal(`<h3>${id?"Editar":"Agregar"} ${E.s}</h3><div class="err" id="fe" style="display:none"></div><form onsubmit="return guardarCrud(event,'${k}',${id||0})" novalidate>${E.campos.map(c=>campo(c,r[c.k])).join("")}<div class="pie"><button type="button" class="btn btn-o" onclick="cerrarModal()">Cancelar</button><button class="btn btn-p">Guardar</button></div></form>`)}
function campo(c,v){const n=`f_${c.k}`;
 if(c.t==="chk")return `<div class="campo chk"><input id="${n}" type="checkbox" ${v?"checked":""}><label for="${n}">${c.l}</label></div>`;
 let i;if(c.t==="area")i=`<textarea id="${n}" ${c.max?`maxlength="${c.max}"`:""}>${esc(v)}</textarea>`;
 else if(c.t==="sel")i=`<select id="${n}"><option value="">Selecciona…</option>${c.o().map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select>`;
 else i=`<input id="${n}" type="${c.t==="date"?"date":"text"}" value="${esc(v)}" ${c.max?`maxlength="${c.max}"`:""}>`;
 return `<div class="campo"><label for="${n}">${c.l}${c.req?" *":""}</label>${i}</div>`}
function leerForm(E){const o={};E.campos.forEach(c=>{const e=$("#f_"+c.k);o[c.k]=c.t==="chk"?e.checked:e.value.trim()});return o}
function guardarCrud(e,k,id){e.preventDefault();const E=ENT[k],o=leerForm(E),l=lista(k);
 const f=E.campos.find(c=>c.req&&!o[c.k]);if(f){const er=$("#fe");er.textContent=`Completa el campo: ${f.l.replace(/ \(.*\)/,"")}.`;er.style.display="block";return false}
 ["especialidadId","estrellas"].forEach(x=>{if(o[x]!==undefined)o[x]=Number(o[x])});
 if(id)Object.assign(l.find(x=>x.id==id),o);else l.push({id:nextId(l),...o});
 guardar();cerrarModal();toast(id?"Cambios guardados.":"Registro agregado.");render();return false}
function pedirBorrar(k,id){const E=ENT[k],r=lista(k).find(x=>x.id==id),n=r.titulo||r.nombre||r.pregunta;
 abrirModal(`<h3>¿Eliminar ${E.s}?</h3><p style="margin:0 0 16px">Se eliminará <b>${esc(n)}</b>. Esta acción no se puede deshacer.</p><div class="pie"><button class="btn btn-o" onclick="cerrarModal()">Cancelar</button><button class="btn btn-r" onclick="borrar('${k}',${id})">Eliminar</button></div>`)}
function borrar(k,id){
 if(k==="especialidades"&&DB.medicos.some(m=>m.especialidadId==id)){cerrarModal();return toast("No se puede eliminar: hay médicos con esta especialidad.")}
 if(k==="medicos"&&DB.citas.some(c=>c.medicoId==id)){cerrarModal();return toast("No se puede eliminar: el médico tiene citas registradas.")}
 const key=ENT[k].lista||k;DB[key]=DB[key].filter(x=>x.id!=id);guardar();cerrarModal();toast("Registro eliminado.");render()}

 <button class="btn btn-p">Guardar cambios</button></form></div>`)}
function guardarCentro(e){e.preventDefault();const ks=["nombre","telefono","correo","horario","direccion","mision","vision","valores"],o={};
 for(const k of ks){const v=$("#f_c_"+k).value.trim();if(!v){const er=$("#fe");er.textContent="Completa todos los campos.";er.style.display="block";return false}o[k]=v}
 if(!/^\S+@\S+\.\S+$/.test(o.correo)){const er=$("#fe");er.textContent="Escribe un correo válido.";er.style.display="block";return false}

const MAX_INT=3,ESPERA=60;
function pRecuperar(){rec={paso:1,correo:"",u:null};return `<div class="login"><div class="lp"><div><a class="marca" href="#/" style="color:#fff"><i style="background:#fff;color:var(--azul)">+</i>MedicDate</a><h1>Recupera tu acceso.</h1><p>Responde tu pregunta secreta y crea una contraseña nueva. No enviamos códigos por correo.</p><ul><li>Escribe tu correo</li><li>Responde tu pregunta secreta</li><li>Crea tu contraseña nueva</li></ul></div><span style="font-size:13px;color:#DCE9F7">© 2026 Centro Médico Sagrado Corazón · Huejutla de Reyes, Hgo.</span></div><div class="lf"><div class="lc" id="recBox">${recHtml()}</div></div></div>`}

const recErr=m=>{const e=$("#re");e.textContent=m;e.style.display="block";return false};
function recHtml(){const p=rec.paso;
 const pasos=p<4?`<div class="pasos">${[1,2,3].map(i=>`<span class="${i<=p?"on":""}"></span>`).join("")}</div><div style="font-size:13px;color:var(--suave);margin-bottom:16px">Paso ${p} de 3</div>`:"";
 const volver='<p style="text-align:center;margin:16px 0 0"><a href="#/login">← Volver a iniciar sesión</a></p>';
 if(p===1)return `${pasos}<h2>Recuperar contraseña</h2><p class="s">Escribe el correo de tu cuenta.</p><div class="err" id="re" style="display:none"></div>
  <form onsubmit="return recPaso1(event)" novalidate><div class="campo"><label for="rc">Correo</label><input id="rc" type="email" autocomplete="username" placeholder="nombre@centromedico.com" value="${esc(rec.correo)}"></div><button class="btn btn-p" style="width:100%">Continuar</button></form>${volver}
  <div class="demo-cred"><b>Respuestas de demostración</b><br>admin@centromedico.com → Rocky<br>elena.cruz@centromedico.com → Huejutla<br>jose.rodriguez@centromedico.com → Benito Juárez</div>`;
 if(p===2)return `${pasos}<h2>Pregunta secreta</h2><p class="s">Responde la pregunta que elegiste al crear tu cuenta.</p><div class="err" id="re" style="display:none"></div>
  <form onsubmit="return recPaso2(event)" novalidate><div class="preg"><small>Tu pregunta</small><b>${esc(PREGUNTAS[rec.u.pregunta])}</b></div><div class="campo"><label for="rr">Tu respuesta</label><input id="rr" type="text" autocomplete="off"></div><button class="btn btn-p" style="width:100%">Verificar respuesta</button></form>
  <p style="text-align:center;margin:16px 0 0"><a href="#/recuperar">Usar otro correo</a></p>`;
 if(p===3)return `${pasos}<h2>Contraseña nueva</h2><p class="s">Elige una contraseña de al menos 8 caracteres.</p><div class="err" id="re" style="display:none"></div>
  <form onsubmit="return recPaso3(event)" novalidate><div class="campo"><label for="rn">Contraseña nueva</label><input id="rn" type="password" autocomplete="new-password"></div><div class="campo"><label for="rm">Repite la contraseña</label><input id="rm" type="password" autocomplete="new-password"></div><button class="btn btn-p" style="width:100%">Guardar contraseña</button></form>`;
 return `<div class="ok-ic">✓</div><h2 style="text-align:center">Contraseña actualizada</h2><p class="s" style="text-align:center">Ya puedes iniciar sesión con tu contraseña nueva.</p><a class="btn btn-p" style="width:100%" href="#/login">Ir a iniciar sesión</a>`}
function recPaso1(e){e.preventDefault();const c=$("#rc").value.trim().toLowerCase();rec.correo=c;
 if(!c)return recErr("Escribe tu correo.");if(!/^\S+@\S+\.\S+$/.test(c))return recErr("Escribe un correo válido.");
 const u=DB.usuarios.find(x=>x.correo.toLowerCase()===c);
 if(!u||!u.activo||!u.respuesta)return recErr("No es posible recuperar la contraseña de ese correo. Habla con el administrador del centro.");
 rec.u=u;rec.paso=2;pintarRec();return false}
function recPaso2(e){e.preventDefault();const r=norm($("#rr").value),k=rec.u.correo;
 const t=INT[k]||(INT[k]={n:0,hasta:0}),resto=Math.ceil((t.hasta-Date.now())/1000);
 if(resto>0)return recErr(`Demasiados intentos. Espera ${resto} segundos para volver a intentar.`);
 if(!r)return recErr("Escribe tu respuesta.");
 if(r!==rec.u.respuesta){t.n++;if(t.n>=MAX_INT){t.n=0;t.hasta=Date.now()+ESPERA*1000;return recErr(`Demasiados intentos. Espera ${ESPERA} segundos para volver a intentar.`)}return recErr(`Respuesta incorrecta. Te quedan ${MAX_INT-t.n} ${MAX_INT-t.n===1?"intento":"intentos"}.`)}
 t.n=0;rec.paso=3;pintarRec();return false}
function recPaso3(e){e.preventDefault();const n=$("#rn").value,m=$("#rm").value;
 if(rec.paso!==3||!rec.u)return false;
 if(n.length<8)return recErr("La contraseña debe tener al menos 8 caracteres.");if(n!==m)return recErr("Las contraseñas no coinciden.");
 const u=DB.usuarios.find(x=>x.id===rec.u.id);if(n===u.clave)return recErr("La contraseña nueva debe ser distinta de la actual.");

 if(u.activo&&id===usuario.id)return toast("No puedes desactivar tu propia cuenta.");
 if(u.activo&&u.rol==="admin"&&!adminsActivos(id))return toast("Debe quedar al menos un administrador activo.");
 u.activo=!u.activo;guardar();toast(u.activo?"Cuenta activada.":"Cuenta desactivada.");render()}
function pedirBorrarU(id){const u=DB.usuarios.find(x=>x.id===id);
 abrirModal(`<h3>¿Eliminar usuario?</h3><p style="margin:0 0 16px">Se eliminará la cuenta de <b>${esc(nombreU(u))}</b> y ya no podrá entrar. Esta acción no se puede deshacer.</p><div class="pie"><button class="btn btn-o" onclick="cerrarModal()">Cancelar</button><button class="btn btn-r" onclick="borrarU(${id})">Eliminar</button></div>`)}
function borrarU(id){const u=DB.usuarios.find(x=>x.id===id);cerrarModal();
 if(id===usuario.id)return toast("No puedes eliminar tu propia cuenta.");
 if(u.rol==="admin"&&u.activo&&!adminsActivos(id))return toast("Debe quedar al menos un administrador activo.");
 DB.usuarios=DB.usuarios.filter(x=>x.id!==id);guardar();toast("Usuario eliminado.");render()}
/* ================= mi cuenta (todos los perfiles) ================= */
function vCuenta(b){const u=DB.usuarios.find(x=>x.id===usuario.id)||usuario;
 return privado(b,"cuenta","Mi cuenta",`<div class="panel" style="max-width:560px"><div class="kv" style="margin-bottom:20px"><b>Nombre</b><span>${esc(nombreU(u))}</span><b>Correo</b><span>${esc(u.correo)}</span><b>Perfil</b><span>${ROLES[u.rol]}</span></div>
 <h3 style="font-size:18px;margin-bottom:12px">Cambiar contraseña</h3><div class="err" id="fe" style="display:none"></div>
 <form onsubmit="return guardarCuenta(event)" novalidate><div class="campo"><label for="k1">Contraseña actual</label><input id="k1" type="password" autocomplete="current-password"></div><div class="campo"><label for="k2">Contraseña nueva (mínimo 8 caracteres)</label><input id="k2" type="password" autocomplete="new-password"></div><div class="campo"><label for="k3">Repite la contraseña nueva</label><input id="k3" type="password" autocomplete="new-password"></div><button class="btn btn-p">Guardar contraseña</button></form></div>
 <div class="panel" style="max-width:560px"><h3 style="font-size:18px;margin-bottom:6px">Pregunta secreta</h3><p style="margin:0 0 14px;color:var(--suave)">Sirve para recuperar tu contraseña si la olvidas. ${u.respuesta?`Pregunta actual: <b>${esc(PREGUNTAS[u.pregunta])}</b>`:"Aún no tienes una configurada."}</p><div class="err" id="fe2" style="display:none"></div>
 <form onsubmit="return guardarPregunta(event)" novalidate>${campo({k:"q_preg",l:"Pregunta",t:"sel",req:1,o:()=>PREGUNTAS.map((q,i)=>[i,q])},u.pregunta)}${campo({k:"q_resp",l:"Respuesta",req:1},"")}<div class="campo"><label for="q_clave">Contraseña actual (para confirmar)</label><input id="q_clave" type="password" autocomplete="current-password"></div><button class="btn btn-p">Guardar pregunta secreta</button></form></div>`)}
function guardarPregunta(e){e.preventDefault();const u=DB.usuarios.find(x=>x.id===usuario.id),er=$("#fe2"),mal=m=>{er.textContent=m;er.style.display="block";return false};
 const q=$("#f_q_preg").value,r=norm($("#f_q_resp").value);
 if(q==="")return mal("Elige una pregunta.");if(!r)return mal("Escribe la respuesta.");if(r.length<3)return mal("La respuesta debe tener al menos 3 caracteres.");
 if($("#q_clave").value!==u.clave)return mal("La contraseña actual no es correcta.");
 u.pregunta=Number(q);u.respuesta=r;guardar();toast("Pregunta secreta guardada.");render();return false}
function guardarCuenta(e){e.preventDefault();const u=DB.usuarios.find(x=>x.id===usuario.id),er=$("#fe"),mal=m=>{er.textContent=m;er.style.display="block";return false};
 const a=$("#k1").value,n=$("#k2").value,r=$("#k3").value;
 if(a!==u.clave)return mal("La contraseña actual no es correcta.");if(n.length<8)return mal("La contraseña nueva debe tener al menos 8 caracteres.");if(n!==r)return mal("Las contraseñas nuevas no coinciden.");if(n===a)return mal("La contraseña nueva debe ser distinta de la actual.");
 u.clave=n;usuario.clave=n;guardar();toast("Contraseña actualizada.");render();return false}
function vistaPriv(b,s){
 if(s==="cuenta")return vCuenta(b);
 if(b==="doctor")return s==="agenda"?vMiAgenda():s==="pacientes"?vMisPacientes():vMiResumen();
 if(b==="asistente")return s==="pacientes"?vPacientes(b):vAgenda(b);
 if(s==="usuarios")return vUsuarios();
 if(s==="centro")return vCentro();if(s==="aviso")return vAviso();if(ENT[s])return vCrud(s);return vPanel()}
/* ================= enrutador ================= */
function render(conservarFoco){
 const p=ruta.slice(1).split("/"),app=$("#app");let html;cerrarModal();clearInterval(timer);
 const priv=["admin","asistente","doctor"].includes(p[0]);
 if(priv&&!usuario){go("/login");return}
 if(priv&&usuario.rol!=={admin:"admin",asistente:"asistente",doctor:"medico"}[p[0]]){go(dest(usuario));return}
 if(priv)html=vistaPriv(p[0],p[1]||"");
 else if(p[0]==="login"){if(usuario){go(dest(usuario));return}html=pLogin()}
 else html=({"":pInicio,especialidades:pEspecialidades,especialidad:()=>pEspecialidad(p[1]),medicos:pMedicos,medico:()=>pMedico(p[1]),servicios:pServicios,servicio:()=>pServicio(p[1]),"quienes-somos":pNosotros,preguntas:pFaq,consejos:pConsejos,consejo:()=>pConsejo(p[1]),aviso:pAviso,recuperar:pRecuperar}[p[0]]||pInicio)();
 app.innerHTML=html;
 if(conservarFoco&&$("#bq")){const b=$("#bq");b.focus();b.setSelectionRange(b.value.length,b.value.length)}
 else if(!conservarFoco)window.scrollTo(0,0);
 if($("#hero")&&DB.hero.length>1)timer=setInterval(()=>slide(1),6000);
}
window.addEventListener("hashchange",()=>{const r=(location.hash||"#/").slice(1)||"/";if(r!==ruta){ruta=r;render()}});
(function(){try{var as=new URLSearchParams(location.search).get("as");if(as){var u=DB.usuarios.find(function(x){return x.rol===as&&x.activo});if(u)usuario=Object.assign({},u)}}catch(e){}})();
render();
</script>
